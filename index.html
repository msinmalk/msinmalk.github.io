<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="./static/style.css">
  <meta charset="utf-8">
  <title>Home · Mohsin Malik</title>

    document.addEventListener("DOMContentLoaded", function() {
      fetch('./header.html')

        });
    });
  </script>
</head>
<body>

  <div id="content">
    <!-- Page-specific content goes here -->
  </div>
</body>
</html>
