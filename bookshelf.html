<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="./static/style.css">
  <meta charset="utf-8">
  <title>Home · Mohsin Malik</title>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      fetch('./header.html')
        .then(response => response.text())
        .then(data => {
          document.getElementById('header-container').innerHTML = data;
        });
    });
  </script>

</head>
  
<body>


  <div id="header-container"></div>


  <!-- Main Content -->
  <div id="content">
    <p>Bookshelf</p>
    <p></p>

    <!-- Example list of books -->
    <ul class="books-list">
      <li class="book-item">
        <img src="./static/images/book1.jpg" alt="The Master & Margarita">
        <div class="book-info">
          <p>The Master & Margarita</p>
          <p><strong>Author:</strong> Mikhail Bulgakov/p>
          <p></p>
        </div>
      </li>
      <li class="book-item">
        <img src="./static/images/book2.jpg" alt="The Houses of Belgrade">
        <div class="book-info">
          <p>The Houses of Belgrade</p>
          <p><strong>Author:</strong> The Houses of Belgrade</p>
          <p></p>
        </div>
      </li>
      <!-- Add more book items as needed -->
    </ul>
    

  </div>
</body>
</html>
