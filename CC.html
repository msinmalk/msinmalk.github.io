<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="./static/style.css">
  <meta charset="utf-8">
  <title>CC · Mohsin Malik</title>
  <script src="./static/lazy-load.js"></script>
  <style>
    /* Bikini-style shiny scrolling background */
    body {
      background: linear-gradient(45deg, #FF69B4, #FF1493, #FFB6C1, #FFC0CB, #FF69B4, #FF1493);
      background-size: 400% 400%;
      animation: bikiniShimmer 8s ease-in-out infinite;
    }
    
    @keyframes bikiniShimmer {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    /* Hot pink image borders */
    .cc-image {
      border: 4px solid #FF1493;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(255, 20, 147, 0.5);
      transition: all 0.3s ease;
      margin: 15px;
    }
    
    .cc-image:hover {
      border-color: #FF69B4;
      box-shadow: 0 0 30px rgba(255, 105, 180, 0.8);
      transform: scale(1.05);
    }
    
    .image-caption {
      background: linear-gradient(45deg, #FF1493, #FF69B4);
      color: white;
      padding: 8px 12px;
      border-radius: 20px;
      font-weight: bold;
      text-align: center;
      margin: 10px 0;
      box-shadow: 0 4px 15px rgba(255, 20, 147, 0.3);
    }
    
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      padding: 20px;
    }
    
    .image-item {
      text-align: center;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 15px;
      padding: 15px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
    }
  </style>
  <script>
    // Fun bikini color palette for scrolling
    const bikiniColors = [
      '#FF69B4', // Hot Pink
      '#FF1493', // Deep Pink
      '#FFB6C1', // Light Pink
      '#FFC0CB', // Pink
      '#FFB6C1', // Light Pink
      '#FFC0CB', // Pink
      '#FF69B4', // Hot Pink
      '#FF1493', // Deep Pink
      '#FFB6C1', // Light Pink
      '#FFC0CB', // Pink
      '#FF69B4', // Hot Pink
      '#FF1493', // Deep Pink
      '#FFB6C1', // Light Pink
      '#FFC0CB', // Pink
      '#FF69B4', // Hot Pink
      '#FF1493'  // Deep Pink
    ];

    // Dynamic background color change on scroll
    function setupBikiniBackground() {
      const images = document.querySelectorAll('.cc-image');
      const body = document.body;

      if (images.length === 0) return;

      function updateBackground() {
        const scrollTop = window.pageYOffset;
        const docHeight = document.documentElement.scrollHeight - window.innerHeight;
        const scrollProgress = Math.min(scrollTop / docHeight, 1);

        const colorIndex = Math.floor(scrollProgress * (bikiniColors.length - 1));
        const currentColor = bikiniColors[colorIndex];

        body.style.transition = 'background-color 0.5s ease';
        body.style.background = `linear-gradient(45deg, ${currentColor}, #FF1493, #FFB6C1, #FFC0CB, ${currentColor}, #FF1493)`;
      }

      let ticking = false;
      function onScroll() {
        if (!ticking) {
          requestAnimationFrame(() => {
            updateBackground();
            ticking = false;
          });
          ticking = true;
        }
      }

      window.addEventListener('scroll', onScroll);
      updateBackground();
    }

    // Password protection
    function checkPassword() {
      const password = prompt("Enter password to access CC page:");
      if (password === "Chan!Chan1") {
        // Show the content
        document.getElementById('protected-content').style.display = 'block';
        document.getElementById('password-prompt').style.display = 'none';
        // Initialize the fun bikini background effect
        setTimeout(setupBikiniBackground, 100);
      } else {
        alert("Incorrect password. Access denied.");
        window.location.href = "./pictures.html";
      }
    }

    // Check password when page loads
    window.onload = checkPassword;
  </script>
</head>
<body>

<span class="title">Mohsin Malik</span>

  <li><a href="magdalene.html">Magdalene</a></li>
</ul>
</div>
<div id="left">&nbsp;</div>
<div id="content">

    <!-- Password Prompt -->
    <div id="password-prompt" style="text-align: center; margin: 50px 0;">
        <h1>🔒 CC Gallery</h1>
        <p>This page is password protected.</p>
        <p>Please enter the password to access the content.</p>
    </div>

    <!-- Protected Content -->
    <div id="protected-content" style="display: none;">
        <h1>💖 CC Gallery 💖</h1>
        
        <div class="gallery-grid">
            <div class="image-item">
                <img data-src="./static/images/ch_crt/ab1e1960-eb15-4b07-842a-bb407f311dd2.jpg" data-alt="CC Portrait" class="cc-image" style="max-width: 100%; height: 300px; object-fit: cover;">
                <div class="image-caption">"When you're the main character and everyone knows it" ✨</div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
