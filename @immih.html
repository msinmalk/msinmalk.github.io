  <meta charset="utf-8">
  <title>Immih · Mohsin Malik</title>
  <script>
    // Password protection with session persistence
    function checkPassword() {
      // Check if already authenticated in this session
      if (sessionStorage.getItem('authenticated') === 'true') {
        // Redirect to kenn page immediately
        window.location.href = "./@kenn.html";
        return;
      }
      
      // Otherwise, prompt for password
      const password = prompt("Enter password to access Immih page:");
      if (password === "Chan!Chan1") {
        // Store authentication in sessionStorage
        sessionStorage.setItem('authenticated', 'true');
        // Redirect to kenn page
        window.location.href = "./@kenn.html";
      } else {
        alert("Incorrect password. Access denied.");
        window.location.href = "./pictures.html";
      }
    }
    
    // Check password when page loads
    window.onload = checkPassword;
  </script>
